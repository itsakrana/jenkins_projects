<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>DevOps 3-Tier Pipeline</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

  <h1>3-Tier DevOps CI/CD Pipeline</h1>
  <p class="flow">GitHub → Jenkins → Docker → DockerHub → Deploy</p>

  <div class="grid">

    <div class="box">
      <h2>Frontend</h2>
      <p>Nginx Static</p>
      <span class="badge green">Running</span>
    </div>

    <div class="box">
      <h2>Backend</h2>
      <p>Node.js API</p>
      <span class="badge green">Connected</span>
    </div>

    <div class="box">
      <h2>Database</h2>
      <p>MongoDB</p>
      <span class="badge green">Online</span>
    </div>

  </div>

  <div class="cicd">
    <h3>CI/CD Status</h3>
    <p>Automated build, push and deployment using Jenkins pipeline</p>
  </div>

  <footer>
    DevOps Project • Ankit Rana
  </footer>

</div>

</body>
</html>
